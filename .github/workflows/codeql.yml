name: CodeQL

# Code scanning needs GitHub Advanced Security, which a private repo doesn't
# have unless it's purchased — free only once this repo is public. The job
# below is a no-op (skipped) until then and starts working the moment the
# repo's visibility flips, with nothing to edit here.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '27 3 * * 1'

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
