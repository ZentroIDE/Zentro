name: CI

# This is the public repo's own CI: it proves "build from source" works, on
# a clean machine, on every OS the README promises. No signing step and no
# release secret belongs here — those stay in the private repo's release.yml.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Public repo only: it is free there, and the private repo's release.yml already
    # builds every OS. Running this matrix in the private repo cost ~85 included
    # minutes per run (macOS counts 10x, Windows 2x).
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux GUI dependencies (gtk/webkit2gtk, for wails build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Backend guardrails
        run: node scripts/check-be-guardrails.mjs

      - name: Go vet
        run: go vet ./internal/...

      - name: Go test
        run: go test ./internal/... -count=1

      - name: Frontend install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend guardrails
        working-directory: frontend
        run: npm run check:guardrails

      - name: Frontend boundaries
        run: node scripts/check-feature-boundaries.mjs

      - name: Frontend tsc
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - name: wails build
        # Ubuntu's webkit2gtk package is now 4.1, not the 4.0 Wails links
        # against by default; -tags webkit2_41 switches the pkg-config name.
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            wails build -tags webkit2_41
          else
            wails build
          fi

  secret-scan:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gitleaks itself is MIT-licensed; gitleaks-action additionally requires
      # a paid license for an organization-owned repo, even a public one. Run
      # the tool directly instead — same detector, no license needed.
      - name: Gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@latest detect --source . --log-opts="--all" -v --no-banner --exit-code 1
