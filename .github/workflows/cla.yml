name: CLA Assistant

# Asks first-time contributors to sign the CLA (CLA.md) on their pull request and records
# the signature in signatures/v1/cla.json on the `cla-signatures` branch. The public
# repository only: the private repository takes no outside pull requests.
#
# pull_request_target runs this file from the base branch with write access, so it must
# never check out or run the pull request's code. It does not: the action only reads the
# PR's author list through the API.
#
# Needs the CLA_PERSONAL_ACCESS_TOKEN secret (fine-grained PAT, Contents: read and write
# on this repository) to write the signature file; GITHUB_TOKEN cannot push there when the
# branch is protected, and a PAT keeps the commits attributed to the maintainer.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/ZentroIDE/Zentro/blob/main/CLA.md'
          branch: 'cla-signatures'
          # The maintainer owns the copyright and needs no CLA; automation never signs.
          allowlist: alexnguyen03,dependabot[bot],github-actions[bot]
